# ============================================================
# Fichero de configuración único de osap-storage.
#
# Copia este ejemplo a `config.yaml` (o a la ruta indicada por
# OSAP_CONFIG). `config.yaml` está en .gitignore: NO subirlo
# (contiene credenciales). No hay valores en el código.
#
# Dominios:
#   storage.openmusicrepository.com -> osap-storage (este proyecto)
#   cdn.openmusicrepository.com     -> Cloudflare R2 (ficheros)
# ============================================================

# Base de datos (MariaDB/MySQL)
db:
  host: 127.0.0.1
  port: 3306
  user: osap
  password: osap
  name: osap_storage
  pool_size: 10

# Servidor HTTP / URL pública de la API
http:
  host: 0.0.0.0
  port: 8000
  public_base_url: https://storage.openmusicrepository.com

# Directorio temporal
temp_dir: /tmp

# Repositorio oficial de OpenMusicRepository (no "backend").
#   provider: local          -> desarrollo (disco de la máquina)
#   provider: cloudflare_r2  -> producción (Cloudflare R2)
bootstrap:
  create_default_provider: true

repository:
  provider: local
  local:
    root: data/files
  cloudflare_r2:
    bucket: pdmx
    endpoint: https://ACCOUNT.r2.cloudflarestorage.com
    account_id: ACCOUNT
    access_key: CAMBIAR
    secret_key: CAMBIAR
    public_url: https://cdn.openmusicrepository.com
    path_prefix: pdmx
    serve_directly: true

# Proveedores de ingesta (offline). PDMX es una fuente de ingestión,
# nunca se consulta en el tiempo de respuesta de un usuario.
providers:
  pdmx:
    source:
      csv: data/pdmx/pdmx.csv
      zenodo:
        base_url: https://zenodo.org/records/XXXX

# Autenticación de servicio (service-auth-v1).
# Desactivada por defecto (auth.enabled: false). Al desplegar la frontera de seguridad,
# se activa con el JWKS de osap-auth y la audiencia de storage.
auth:
  enabled: false
  issuer: https://auth.openmusicrepository.com
  audience: osap-storage
  jwks_url: https://auth.openmusicrepository.com/.well-known/jwks.json
  # public_key: <PEM de osap-auth>   # alternativa/local (sin JWKS)
  # kid: osap-auth-v1
  clock_skew_seconds: 60
