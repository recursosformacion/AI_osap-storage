# ============================================================
# Configuración de PRODUCCIÓN (servidor 91.134.255.134).
#
# Copia a `config.yaml` en el servidor (o usa OSAP_CONFIG).
# Este fichero es SOLO una plantilla de referencia: producción
# no se modifica durante el desarrollo, únicamente al cerrar
# una versión. No contiene credenciales reales.
# ============================================================

db:
  host: 127.0.0.1
  port: 3306
  user: osap
  password: CAMBIAR
  name: osap_storage
  pool_size: 10

http:
  host: 127.0.0.1
  port: 8000
  public_base_url: https://storage.openmusicrepository.com

temp_dir: /home/ocw/openmusicrepository.com/tmp

bootstrap:
  create_default_provider: true

repository:
  provider: cloudflare_r2
  cloudflare_r2:
    bucket: pdmx
    endpoint: https://ACCOUNT.r2.cloudflarestorage.com
    account_id: ACCOUNT
    access_key: CAMBIAR
    secret_key: CAMBIAR
    public_url: https://cdn.openmusicrepository.com
    path_prefix: pdmx
    serve_directly: true

providers:
  pdmx:
    source:
      csv: /home/ocw/openmusicrepository.com/PDMX.csv
      zenodo:
        base_url: https://zenodo.org/records/XXXX
