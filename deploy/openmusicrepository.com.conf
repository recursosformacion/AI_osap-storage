# openmusicrepository.com / www -> app.openmusicrepository.com (canónico para SEO)
server {
    listen 80;
    listen [::]:80;
    server_name openmusicrepository.com www.openmusicrepository.com;
    location ~ /.well-known/acme-challenge {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr:$remote_port;
        proxy_pass http://127.0.0.1:9180;
    }
    location / {
        return 301 https://app.openmusicrepository.com$request_uri;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name openmusicrepository.com www.openmusicrepository.com;
    ssl_certificate /etc/letsencrypt/live/storage.openmusicrepository.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/storage.openmusicrepository.com/privkey.pem;
    location ~ /.well-known/acme-challenge {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr:$remote_port;
        proxy_pass http://127.0.0.1:9180;
    }
    location / {
        return 301 https://app.openmusicrepository.com$request_uri;
    }
}

# storage.openmusicrepository.com -> osap-storage API (8000)
# Acceso restringido: solo desde la app (openmusicrepository.com/app) o desde el propio
# servidor (M2M/OSAP interno). Bloquea el acceso directo/externo.
server {
    listen 80;
    listen [::]:80;
    server_name storage.openmusicrepository.com;
    client_max_body_size 100m;
    location / {
        set $osap_ok 0;
        if ($http_referer ~* ^https?://(app\.)?openmusicrepository\.com) { set $osap_ok 1; }
        if ($http_origin  ~* ^https?://(app\.)?openmusicrepository\.com)  { set $osap_ok 1; }
        if ($remote_addr ~ "^(127\.0\.0\.1|::1|91\.134\.255\.134|2001:41d0:20a:900::182)$") { set $osap_ok 1; }
        if ($http_cf_connecting_ip = "91.134.255.134") { set $osap_ok 1; }
        if ($http_cf_connecting_ip = "2001:41d0:20a:900::182") { set $osap_ok 1; }
        if ($osap_ok = 0) { return 403; }

        proxy_pass http://osap_storage;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ /.well-known/acme-challenge {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr:$remote_port;
        proxy_pass http://127.0.0.1:9180;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name storage.openmusicrepository.com;
    ssl_certificate /etc/letsencrypt/live/storage.openmusicrepository.com/fullchain.pem;
