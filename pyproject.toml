[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "osap-storage"
version = "0.1.0"
description = "Gestion de almacenamiento, adquisicion y distribucion de ficheros para OSAP."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "aiomysql>=0.2.0",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
osap-storage-api = "api.main:run"
osap-storage = "infrastructure.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["domain", "application", "infrastructure", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["domain", "application", "infrastructure", "api", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"api/routes/*.py" = ["B008", "E501"]
"api/routes/root.py" = ["E501"]
"api/metrics.py" = ["B008"]
"api/web/*.py" = ["E501"]
